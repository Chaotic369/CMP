<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        neu: {
          bg: 'var(--neu-bg)',
          box: 'var(--neu-box)',
          track: 'var(--neu-track)',
          text: 'var(--neu-text)',
          accent: 'var(--neu-accent)',
          highlight: 'var(--neu-highlight)'
        }
      },
      fontFamily: {
        sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
        mono: ['JetBrains Mono', 'monospace']
      }
    }
  }
}

<style>
  :root {
    --neu-bg: #fbfaf6;
    --neu-box: #f2f0e6;
    --neu-track: #e8e5d8;
    --neu-text: #000000;
    --neu-accent: #666666;
    --neu-highlight: #000000;
  }
  .dark-mode {
      --neu-bg: #000000;
    --neu-box: #080c4a;
    --neu-track: #15195c;
    --neu-text: #e2e8f0;
    --neu-accent: #818cf8;
    --neu-highlight: #c7d2fe;
  }
  body {
    background-color: var(--neu-bg);
    color: var(--neu-text);
    font-weight: 400;
  }
  .custom-scrollbar::-webkit-scrollbar {
    width: 8px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: var(--neu-bg);
    border-radius: 4px;
    margin-block: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: var(--neu-track);
    border-radius: 4px;
  }
  input[type="checkbox"] {
    appearance: none;
    background-color: var(--neu-track);
    margin: 0;
    font: inherit;
    color: currentColor;
    width: 1.25em;
    height: 1.25em;
    border-radius: 0.35em;
    display: grid;
    place-content: center;
    transition: all 0.2s ease-in-out;
  }
  input[type="checkbox"]::before {
    content: "";
    width: 0.65em;
    height: 0.65em;
    border-radius: 2px;
    transform: scale(0);
    transition: 150ms transform ease-in-out;
    background-color: var(--neu-highlight);
  }
  input[type="checkbox"]:checked::before {
    transform: scale(1);
  }
</style>
<script>
  function initTheme() {
    if (localStorage.getItem('bca-theme') === 'dark') {
      document.documentElement.classList.add('dark-mode');
    }
  }
  initTheme();
</script>
</head>

          // Take a deep clone snapshot of the current state before modifying it

            syllabus: JSON.parse(JSON.stringify(curriculumSyllabus)),
            map: JSON.parse(JSON.stringify(completedTopicsMap))
          });
        
          // Cap the history to the last 30 actions to save memory
          if (historyStack.length > 30) historyStack.shift();
        
          const undoBtn = document.getElementById('undo-btn');
          if (undoBtn) undoBtn.classList.remove('hidden');
        }

        function undoChange() {
                if (historyStack.length === 0) return;
        
                // Pop the last saved state and restore it
                const prevState = historyStack.pop();
                curriculumSyllabus = prevState.syllabus;
                completedTopicsMap = prevState.map;
        
                if (historyStack.length === 0) {
                  const undoBtn = document.getElementById('undo-btn');
                  if (undoBtn) undoBtn.classList.add('hidden');

                                                                                                                <div class="flex items-center gap-2 pt-0.5 pr-1 shrink-0">
                                                                                                                  <button onclick="editTopic('${subject.id}', ${unitIdx}, ${topicIdx})" class="text-neu-accent hover:text-neu-highlight transition-colors" title="Edit Topic">
                                                                                                                    <i class="fa-solid fa-pen text-[10px]"></i>
                                                                                                                  </button>
                                                                                                                  <button onclick="deleteTopic('${subject.id}', ${unitIdx}, ${topicIdx})" class="text-neu-accent hover:text-red-400 transition-colors" title="Delete Topic">
                                                                                                                    <i class="fa-solid fa-xmark text-[11.5px]"></i>
                                                                                                                  </button>
                                                                                                                </div>
                                                                                                              ` : '';
                                                            
                                                                                                              html += `
                                                                                                                <li class="flex items-start space-x-3 text-xs text-neu-text transition-colors bg-neu-box rounded-xl -mx-2 p-2 touch-manipulation group">
                                                                                                                  ${dragHandle}
                                                                                                                  <input 
                                                                                                                    type="checkbox" 
                                                                                                                    id="${uniqueId}" 
                                                                                                                    class="mt-0.5 flex-shrink-0 cursor-pointer"
                                                                                                                    onchange="toggleTopicCompletion('${uniqueId}')"
                                                                                                                  >
                                                                                                                  <div class="flex-1 pr-1">
                                                                                                                    <label for="${uniqueId}" onclick="copyTopic(this.innerText)" class="cursor-pointer select-none leading-relaxed font-light block active:opacity-50 transition-opacity" title="Touch to copy">${topic}</label>
                                                                                                                    <span id="ts-${uniqueId}" class="text-[9px] text-neu-accent mt-0.5 font-mono empty:hidden block"></span>
                                                                                                                  </div>
                                                                                                                  ${itemControls}
                                                                                                                </li>
                                                                                                              `;
                                                                                                            });

                                                                                                    const addTopicBtn = isEditMode ? `
                                                                                                            <div class="pt-3">
                                                                                                              <button onclick="promptAppendTopic('${subject.id}', ${unitIdx})" class="text-[11px] font-medium text-neu-accent hover:text-neu-highlight hover:bg-neu-track/50 transition-colors flex items-center gap-1.5 py-1.5 px-3 rounded-lg active:scale-95 border border-dashed border-neu-track w-max">
                                                                                                                <i class="fa-solid fa-plus"></i> Add Topic
                                                                                                              </button>
                                                                                                            </div>` : '';

                                                                                                    html += `
                                                                                                            </ul>
                                                                                                            ${addTopicBtn}
                                                                                                          </div>`;
                                                                                                                                                            });

                                                                html += `</div></div>`;
            subjectCard.innerHTML = html;
            root.appendChild(subjectCard);
          });

          // Initialize drag and drop behavior
                    document.querySelectorAll('.sortable-list').forEach(listEl => {
                      Sortable.create(listEl, {
                        disabled: !isEditMode,
                        animation: 200,
                        delay: 250, // Long press threshold in ms
                        delayOnTouchOnly: true, // Only require long press on mobile touch devices
              handle: 'li', // Makes the entire block draggable, not just the handle
              ghostClass: 'opacity-40', // Visual cue for the item being dragged
              onEnd: function (evt) {
                const subjectId = evt.from.getAttribute('data-subject');
                const unitIdx = parseInt(evt.from.getAttribute('data-unit'));
                const oldIndex = evt.oldIndex;
                const newIndex = evt.newIndex;
          
                if (oldIndex !== newIndex) {
                  reorderTopic(subjectId, unitIdx, oldIndex, newIndex);
                }
              }
            });
          });

          restoreCheckboxStates();
          evaluateProgressCalculations();
        }

  function evaluateProgressCalculations() {
    let grandTotalCount = 0;
    let grandCompletedCount = 0;

    curriculumSyllabus.forEach(subject => {
      let subjectTotal = 0;
      let subjectCompleted = 0;

      subject.units.forEach((unit, unitIdx) => {
        unit.topics.forEach((_, topicIdx) => {
          grandTotalCount++;
          subjectTotal++;
          const uniqueId = `${subject.id}_u${unitIdx}_t${topicIdx}`;
          if (completedTopicsMap[uniqueId]) {
            grandCompletedCount++;
            subjectCompleted++;
          }
        });
      });

      const bar = document.getElementById(`bar-${subject.id}`);
            const percText = document.getElementById(`perc-${subject.id}`);
            if (bar && percText) {
              const subPerc = subjectTotal > 0 ? Math.round((subjectCompleted / subjectTotal) * 100) : 0;
              bar.style.width = `${subPerc}%`;
              bar.style.backgroundColor = `hsl(${subPerc * 1.2}, 85%, 55%)`;
              percText.innerText = `${subPerc}%`;
            }
    });

    const globalPerc = grandTotalCount > 0 ? Math.round((grandCompletedCount / grandTotalCount) * 100) : 0;
            const globalBar = document.getElementById('global-progress-bar');
            const turtleRunner = document.getElementById('turtle-runner');
    
            if (globalBar) {
              globalBar.style.width = `${globalPerc}%`;
              // Hue maps perfectly: 0% = 0 (Red), 50% = 60 (Yellow), 100% = 120 (Green)
              globalBar.style.backgroundColor = `hsl(${globalPerc * 1.2}, 85%, 55%)`;
            }
            if (turtleRunner) {
              turtleRunner.style.left = `${globalPerc}%`;
            }
          }

  function toggleTopicCompletion(id) {
        const el = document.getElementById(id);
        const tsEl = document.getElementById(`ts-${id}`);
        if (el) {
          pushToHistory();
          if (el.checked) {
          const now = new Date();
          const dateString = now.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
          completedTopicsMap[id] = dateString;
          if (tsEl) tsEl.innerText = dateString;
        } else {
          delete completedTopicsMap[id];
          if (tsEl) tsEl.innerText = "";
        }
        evaluateProgressCalculations();
        saveCloudState();
      }
    }

    function restoreCheckboxStates() {
      Object.keys(completedTopicsMap).forEach(id => {
        const el = document.getElementById(id);
        const tsEl = document.getElementById(`ts-${id}`);
        const val = completedTopicsMap[id];
        if (el && val) {
          el.checked = true;
          if (tsEl) {
            // Backward compatibility check for old boolean values from previous saves
            tsEl.innerText = val === true ? "Completed" : val;
          }
        }
      });
    }

  function renderSubjectRoots() {
          const container = document.getElementById('subject-roots');
          if (!container) return;
    
          container.classList.remove('hidden');
          let html = `<button onclick="switchSubject('all')" class="px-5 py-2 font-medium text-xs border border-neu-track rounded-xl transition-all ${targetedSubjectFilter === 'all' ? 'bg-neu-box text-neu-highlight' : 'hover:bg-neu-box text-neu-text hover:text-neu-highlight'}">All</button>`;
    
          curriculumSyllabus.forEach(subject => {
            if (targetedActiveFilter === 'sem1' && subject.semester !== 1) return;
            if (targetedActiveFilter === 'sem3' && subject.semester !== 3) return;
      
            const shortName = subjectShortNames[subject.id] || subject.title;
            const isActive = targetedSubjectFilter === subject.id;
            const btnClass = isActive ? 'bg-neu-box text-neu-highlight' : 'hover:bg-neu-box text-neu-text hover:text-neu-highlight';
      
            html += `<button onclick="switchSubject('${subject.id}')" class="px-5 py-2 font-medium text-xs border border-neu-track rounded-xl transition-all ${btnClass}">${shortName}</button>`;
          });
    
          container.innerHTML = html;
        }

      function renderUnitRoots() {
                    const container = document.getElementById('unit-roots');
                    if (!container) return;
  
                    container.classList.remove('hidden');
                    let html = `<button onclick="switchUnit('all')" class="px-5 py-2 font-medium text-xs border border-neu-track rounded-xl transition-all ${targetedUnitFilter === 'all' ? 'bg-neu-box text-neu-highlight' : 'hover:bg-neu-box text-neu-text hover:text-neu-highlight'}">All Units</button>`;
  
                    // Dynamically find the max number of units for the currently selected view
                    let maxUnits = 0;
                    curriculumSyllabus.forEach(subject => {
                      if (targetedActiveFilter === 'sem1' && subject.semester !== 1) return;
                      if (targetedActiveFilter === 'sem3' && subject.semester !== 3) return;
                      if (targetedSubjectFilter !== 'all' && subject.id !== targetedSubjectFilter) return;
                      if (subject.units.length > maxUnits) maxUnits = subject.units.length;
                    });

                    for(let i=1; i<=maxUnits; i++) {
                      const isActive = targetedUnitFilter === `unit${i}`;
                      const btnClass = isActive ? 'bg-neu-box text-neu-highlight' : 'hover:bg-neu-box text-neu-text hover:text-neu-highlight';
                      html += `<button onclick="switchUnit('unit${i}')" class="px-5 py-2 font-medium text-xs border border-neu-track rounded-xl transition-all ${btnClass}">Unit ${i}</button>`;
                    }
  
                    container.innerHTML = html;
                  }

            function switchUnit(unitId) {
              targetedUnitFilter = unitId;
              renderUnitRoots();
              renderCurriculumStructure();
            }

            function switchSubject(subjectId) {
              targetedSubjectFilter = subjectId;
              targetedUnitFilter = 'all';
              renderSubjectRoots();
              renderUnitRoots();
              renderCurriculumStructure();
            }

            function switchTab(type) {
                      targetedActiveFilter = type;
                      targetedSubjectFilter = 'all'; // Reset subject filter when changing semesters
                      targetedUnitFilter = 'all'; // Reset unit filter
                      ['sem3', 'sem1'].forEach(t => {
                        const btn = document.getElementById(`tab-${t}`);
                        if (btn) {
                          const isSelected = (t === type);
                          const bgClass = isSelected ? "bg-neu-box" : "hover:bg-neu-box";
        
                          let color = "";
                          if (t === 'sem1') {
                            color = isSelected ? "text-red-600" : "text-red-500 hover:text-red-600";
                          } else {
                            color = isSelected ? "text-neu-highlight" : "text-neu-text hover:text-neu-highlight";
                          }
        
                          btn.className = `px-6 py-3 font-medium text-sm border border-neu-track rounded-2xl transition-all ${bgClass} ${color}`;
                        }
                      });
                      renderSubjectRoots();
                      renderUnitRoots();
                      renderCurriculumStructure();
                    }

    let toastTimeout;
        function showToast(msg) {
          const toast = document.getElementById('toast');
          if (!toast) return;
          toast.innerText = msg;
          toast.classList.remove('opacity-0', 'translate-y-4');
          toast.classList.add('opacity-100', 'translate-y-0');
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'translate-y-4');
          }, 2000);
        }

        function copyTopic(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast("Copied")).catch(e => console.error(e));
          } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'absolute';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showToast("Copied"); } catch(e) {}
            document.body.removeChild(ta);
          }
        }

        function updateSyncStatus(msg, isProcessing = false, isError = false) {
          const dot = document.getElementById('sync-dot');
      if (!dot) return;
    
      dot.classList.remove('bg-neu-accent', 'bg-green-400', 'bg-red-500', 'animate-pulse');
    
      if (isProcessing) {
        dot.classList.add('bg-neu-accent', 'animate-pulse');
      } else if (isError) {
        dot.classList.add('bg-red-500');
      } else {
        dot.classList.add('bg-green-400');
      }
    
      dot.title = msg;
    }

  function promptAppendTopic(subjectId, unitIdx) {
          const newTopic = prompt("Enter new topic name:");
          if (!newTopic || !newTopic.trim()) return;

          const subject = curriculumSyllabus.find(s => s.id === subjectId);
          if (!subject) return;

          const unit = subject.units[unitIdx];
    
          pushToHistory();
          // Simply push to the end of the array, no ID shifting needed
          unit.topics.push(newTopic.trim());
    
        saveCloudState();
        renderCurriculumStructure();
      }

      function editTopic(subjectId, unitIdx, topicIdx) {
        const subject = curriculumSyllabus.find(s => s.id === subjectId);
        if (!subject) return;
        const unit = subject.units[unitIdx];
        const currentName = unit.topics[topicIdx];

        const newTopic = prompt("Edit topic name:", currentName);
        if (!newTopic || newTopic.trim() === "" || newTopic === currentName) return;

        if (typeof pushToHistory === 'function') pushToHistory();
        unit.topics[topicIdx] = newTopic.trim();
      
        saveCloudState();
        renderCurriculumStructure();
      }

      function deleteTopic(subjectId, unitIdx, topicIdx) {
        if (!confirm("Are you sure you want to delete this topic?")) return;

        const subject = curriculumSyllabus.find(s => s.id === subjectId);
        if (!subject) return;
        const unit = subject.units[unitIdx];

        if (typeof pushToHistory === 'function') pushToHistory();

        // Collect current states for the whole unit
        let states = [];
        for (let i = 0; i < unit.topics.length; i++) {
          let id = `${subjectId}_u${unitIdx}_t${i}`;
          states.push(completedTopicsMap[id] || null);
          delete completedTopicsMap[id];
        }

        // Remove the topic and its completion state
        unit.topics.splice(topicIdx, 1);
        states.splice(topicIdx, 1);

        // Re-apply states with new shifted indices
        for (let i = 0; i < unit.topics.length; i++) {
          if (states[i] !== null) {
            completedTopicsMap[`${subjectId}_u${unitIdx}_t${i}`] = states[i];
          }
        }

        saveCloudState();
        renderCurriculumStructure();
      }

      function reorderTopic(subjectId, unitIdx, oldIndex, newIndex) {
          const subject = curriculumSyllabus.find(s => s.id === subjectId);
          if (!subject) return;
          const unit = subject.units[unitIdx];

          pushToHistory();

          // 1. Swap topic positions in the main array
          const movedItem = unit.topics.splice(oldIndex, 1)[0];
      unit.topics.splice(newIndex, 0, movedItem);

      // 2. Re-map the completion states so checkboxes don't jump to the wrong topics
      let unitCompletions = [];
      for (let i = 0; i < unit.topics.length; i++) {
        let id = `${subjectId}_u${unitIdx}_t${i}`;
        unitCompletions[i] = completedTopicsMap[id] || null;
        delete completedTopicsMap[id]; // Erase old mappings for this unit
      }

      // Shift completion statuses exactly like the topics were shifted
      const movedComp = unitCompletions.splice(oldIndex, 1)[0];
      unitCompletions.splice(newIndex, 0, movedComp);

      // Re-apply to global sync map
      for (let i = 0; i < unitCompletions.length; i++) {
        if (unitCompletions[i] !== null) {
          completedTopicsMap[`${subjectId}_u${unitIdx}_t${i}`] = unitCompletions[i];
        }
      }

      saveCloudState();
      // Force a full re-render so element IDs map correctly to their new index
      renderCurriculumStructure(); 
    }

    async function saveCloudState() {
        updateSyncStatus('Syncing changes...', true);
        try {
          const isDark = document.documentElement.classList.contains('dark-mode');
          await USER_DOC.set({ 
            completedTopicsMap,
            customSyllabus: curriculumSyllabus,
            theme: isDark ? 'dark' : 'light'
          }, { merge: true });
          updateSyncStatus('Cloud Synced');
        } catch (e) {
          console.error("Cloud synchronization failure:", e);
          updateSyncStatus('Sync Error (Check Console)', false, true);
        }
      }

    function toggleTheme() {
        const root = document.documentElement;
        root.classList.toggle('dark-mode');
        const isDark = root.classList.contains('dark-mode');
        localStorage.setItem('bca-theme', isDark ? 'dark' : 'light');
    
        const icon = document.querySelector('#theme-toggle i');
        if (icon) {
          icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
      
        // Trigger cloud sync to save the theme preference
        if (typeof saveCloudState === 'function') {
          saveCloudState();
        }
      }

      window.addEventListener('DOMContentLoaded', async () => {
              // Ensure correct icon is set based on initial theme
              const isDark = document.documentElement.classList.contains('dark-mode');
              const icon = document.querySelector('#theme-toggle i');
              if (icon) {
                icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
              }

              updateSyncStatus('Loading curriculum data...', true);
            try {
              const doc = await USER_DOC.get();
              if (doc.exists) {
                const data = doc.data();
                completedTopicsMap = data.completedTopicsMap || {};
          
                if (data.customSyllabus) {
                  curriculumSyllabus = data.customSyllabus;
                }
        
                // Sync theme from cloud if it exists
          if (data.theme) {
            const cloudIsDark = data.theme === 'dark';
            if (cloudIsDark) {
              document.documentElement.classList.add('dark-mode');
            } else {
              document.documentElement.classList.remove('dark-mode');
            }
            localStorage.setItem('bca-theme', data.theme);
            if (icon) {
              icon.className = cloudIsDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }
          }

          updateSyncStatus('Data Loaded & Synced');
        } else {
          updateSyncStatus('New Profile Ready');
        }
      } catch(e) {
                  console.error("Initialization data lookup crashed:", e);
                  updateSyncStatus('Offline / Connection Failed', false, true);
                }
                renderSubjectRoots();
                                renderUnitRoots();
                                renderCurriculumStructure();
                              });
                  </script>

                  <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 translate-y-4 bg-neu-text text-neu-bg px-6 py-2.5 rounded-full text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 z-50 shadow-2xl tracking-wide">
                    Copied
                  </div>
