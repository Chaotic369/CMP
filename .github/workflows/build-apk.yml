# Config v4 - Safe Build
name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Build APK
        run: |
          export CI=true
          export CORDOVA_NO_TELEMETRY=1
          cd /tmp
          cordova create app com.aicompile.app "App" --no-telemetry
          rm -rf app/www/*
          cp -R $GITHUB_WORKSPACE/* app/www/ || true
          cd app
          cordova platform add android@13.0.0 --no-telemetry
          cordova build android --no-telemetry
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: /tmp/app/platforms/android/app/build/outputs/apk/debug/app-debug.apk