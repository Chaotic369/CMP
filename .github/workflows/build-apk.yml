name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with: { node-version: '18' }
        
      - name: Install Cordova
        run: npm install -g cordova
        
      - name: Build APK
        run: |
          mkdir -p /tmp/apk_build
          cordova create /tmp/apk_build/app com.aicompile.app "App"
          cp -r * /tmp/apk_build/app/www/ 2>/dev/null || true
          cd /tmp/apk_build/app
          cordova platform add android
          cordova build android
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Android-APK
          path: /tmp/apk_build/app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
