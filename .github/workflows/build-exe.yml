name: Build Windows EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build App
        shell: bash
        run: |
          mkdir build_app
          cp -R $GITHUB_WORKSPACE/* build_app/ || true
          cd build_app
          npm init -y
          npm install electron electron-builder --save-dev
          if [ -f "index.html" ]; then
            MAIN_FILE="index.html"
          else
            MAIN_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1 | sed 's|^\./||')
          fi
          if [ -z "$MAIN_FILE" ]; then MAIN_FILE="index.html"; fi
          cat << EOF > main.js
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          app.whenReady().then(() => {
            let win = new BrowserWindow({ autoHideMenuBar: true, width: 1280, height: 720, webPreferences: { nodeIntegration: false, contextIsolation: true, webSecurity: false } });
            win.loadFile(path.join(__dirname, '$MAIN_FILE')).catch((err) => console.error('Failed to load:', err));
          });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          EOF
          npm pkg set main="main.js"
          npm pkg set scripts.build="electron-builder --win portable --x64"
          npm pkg set build.appId="com.aicompile.CMP"
          npm pkg set build.productName="CMP"
          npm pkg set version="1.0.3"
          npm run build
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: build_app/dist/*.exe