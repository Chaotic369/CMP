name: Build Windows EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build App
        shell: bash
        run: |
          mkdir build_app
          cp -R $GITHUB_WORKSPACE/* build_app/ || true
          cd build_app
          npm init -y
          npm install electron electron-builder --save-dev
          cat << 'EOF' > main.js
const { app, BrowserWindow } = require('electron');
const path = require('path');
const fs = require('fs');
app.whenReady().then(() => {
  let win = new BrowserWindow({ autoHideMenuBar: true, width: 1280, height: 720, webPreferences: { nodeIntegration: false, contextIsolation: true, webSecurity: false } });
  let mainFile = 'index.html';
  if (!fs.existsSync(path.join(__dirname, mainFile))) {
    let files = fs.readdirSync(__dirname).filter(f => f.endsWith('.html'));
    if (files.length > 0) mainFile = files[0];
  }
  win.loadFile(path.join(__dirname, mainFile)).catch((err) => console.error('Failed to load:', err));
});
app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
EOF
          npm pkg set main="main.js"
          npm pkg set scripts.build="electron-builder --win portable --x64"
          npm pkg set build.appId="com.aicompile.MyApp"
          npm pkg set build.productName="My App"
          npm pkg set version="1.0.0"
          npm run build
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: build_app/dist/*.exe