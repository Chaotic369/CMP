# Config v1 - EXE Builder
name: Build Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build App
        shell: bash
        run: |
          mkdir build_app
          cp -R $GITHUB_WORKSPACE/* build_app/ || true
          cd build_app
          npm init -y
          npm install electron electron-builder --save-dev
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');
          app.whenReady().then(() => {
            let win = new BrowserWindow({ autoHideMenuBar: true, width: 1280, height: 720 });
            win.loadFile('index.html').catch(() => console.log('No index.html found'));
          });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          EOF
          npm pkg set main="main.js"
          npm pkg set scripts.build="electron-builder --win portable --x64"
          npm pkg set build.appId="com.aicompile.app"
          npm pkg set build.productName="App"
          npm run build
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: build_app/dist/*.exe